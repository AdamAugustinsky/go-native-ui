name: isolated fullscreen diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fullscreen:
    runs-on: macos-15
    timeout-minutes: 45 # bounded worst case: 12 fixed attempts, each supervised at 170s
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Keep the display awake
        run: sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
      - name: Fixed control/candidate/native matrix
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          FS_LIVE_LOCK: ${{ runner.temp }}/fullscreen-experiment.lock
        run: |
          git worktree add --detach "$RUNNER_TEMP/fs-control" 05f2a50f15fe8b8458621a57a64ff4c9a1fe7f6b
          git worktree add --detach "$RUNNER_TEMP/fs-candidate" 11acdddb719d82941dc509a88c123e3aed773cb2
          bash tools/fullscreenprobe/run.sh "$RUNNER_TEMP/fs-control" "$RUNNER_TEMP/fs-candidate" "$RUNNER_TEMP/fs-build" "$GITHUB_WORKSPACE/fullscreen-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullscreen-paired-evidence
          path: fullscreen-evidence/
