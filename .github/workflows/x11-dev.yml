name: x11-dev
on:
  push:
    branches: [p5-x11alloc]
    paths: ['.github/workflows/x11-dev.yml', 'platform/**']
jobs:
  pilot:
    name: pilot x11 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      CGO_ENABLED: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GNUI_BACKEND: x11
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libegl1 libegl-mesa0 libgl1 libopengl0 libgles2 libgl1-mesa-dri libxkbcommon0 libx11-6 fontconfig fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
          go build -trimpath -ldflags="-s -w" -o bin/pilot ./cmd/pilot
      - name: strace
        run: |
          sudo apt-get install -y -q strace
          for v in 1 2 3; do
            echo "=== run $v"
            GNUI_NO_PRIME_THREADS=1 xvfb-run -a -s "-screen 0 1280x800x24" strace -f -ttt -e trace=clone,clone3,exit,exit_group -o strace.txt ./bin/pilot -bench -gate -allow-unpaced -max-cpu-us 0 -timeout 200s > out.json 2>err.txt || true
            python3 -c "import json;d=json.load(open('out.json'));print([w['Mallocs'] for w in d['Windows']])"
            python3 - <<'PY'
          import re
          t0=None
          for l in open('strace.txt'):
              m=re.match(r'(\d+) ([0-9.]+) (.*)',l)
              if not m: continue
              pid,t,rest=m.groups(); t=float(t)
              if t0 is None: t0=t
              if 'clone' in rest or 'exit(' in rest:
                  print('%7.2f %s %s'%(t-t0,pid,rest[:90]))
          PY
          done
