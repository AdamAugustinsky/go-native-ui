name: linux-dev
on:
  push:
    branches: [p5-linux]
    paths: ['.github/workflows/linux-dev.yml', 'platform/**', 'internal/wl/**', 'text/**']
jobs:
  platform:
    name: platform tests ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth xclip wl-clipboard weston sway wtype wayland-utils \
            libwayland-client0 libwayland-cursor0 libxkbcommon0 libx11-6 libxfixes3 libxcursor1 libegl1 libegl-mesa0 libgl1-mesa-dri x11-utils imagemagick
      - name: wayland (scripted compositor)
        run: go test -count=1 -v -run 'Wayland' ./platform 2>&1 | tail -150
      - name: x11 (xvfb)
        if: always()
        run: xvfb-run -a -s "-screen 0 1280x800x24" go test -count=1 -v -run 'X11' ./platform 2>&1 | tail -150
      - name: wayland (Sway, a real compositor)
        if: always()
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d); chmod 700 "$XDG_RUNTIME_DIR"
          export WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman
          echo 'output HEADLESS-1 mode 1280x800' > sway.conf
          sway -c sway.conf > sway.log 2>&1 &
          for _ in $(seq 100); do ls "$XDG_RUNTIME_DIR" | grep -q '^wayland-[0-9]*$' && break; sleep 0.1; done
          export WAYLAND_DISPLAY=$(ls "$XDG_RUNTIME_DIR" | grep '^wayland-[0-9]*$' | head -1)
          wtype -s 900000 a > /dev/null 2>&1 &   # a virtual keyboard gives the seat keyboard focus to give
          sleep 1
          GNUI_TEST_SWAY=1 go test -count=1 -v -run 'Sway' ./platform 2>&1 | tail -80
          tail -20 sway.log
