name: m2 capture (branch-only, removed before landing)

on:
  push:
    branches: [p8-win-capture]

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  windows:
    name: media/capture on Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 -v -timeout 10m ./media/capture
