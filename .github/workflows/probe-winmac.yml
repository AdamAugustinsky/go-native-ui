name: probe-winmac
# Temporary: fast Windows iteration for the p5-winmac branch. Removed before the branch is done.
on:
  push:
    branches: [p5-winmac]
env:
  CGO_ENABLED: "0"
jobs:
  windows:
    name: probe Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: platform and gpu tests
        run: go test -count=1 -v -run 'Reveal|FirstFrame|Clipboard|Paste' ./platform/ ./gpu/
      - name: startup A/B (cloaked vs shown at Open), 8 runs each
        run: |
          go build -o bin/spike.exe ./cmd/spike
          go build -o bin/pilot.exe ./cmd/pilot
          for i in 1 2 3 4 5 6 7 8; do
            for mode in "" "-show-first"; do
              ./bin/spike.exe -exit-first $mode -timeout 60s | tr -d '\n ' | grep -o '"ExecToFirstPresentMs":[0-9.]*\|"Stage":"shown","Ms":[0-9.]*\|"Stage":"cloak","Ms":[0-9.]*' | tr '\n' ' ' | sed "s/^/spike [$mode] /"; echo
            done
          done
          for i in 1 2 3 4 5; do ./bin/pilot.exe -exit-first -v -timeout 60s 2>&1 | grep -E "ExecToFirstPresentMs|pilot:"; done
