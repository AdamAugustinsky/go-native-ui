name: x11-dev
on:
  push:
    branches: [p5-x11alloc]
    paths: ['.github/workflows/x11-dev.yml', 'platform/**']
jobs:
  pilot:
    name: pilot x11 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      CGO_ENABLED: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GNUI_BACKEND: x11
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libegl1 libegl-mesa0 libgl1 libopengl0 libgles2 libgl1-mesa-dri libxkbcommon0 libx11-6 fontconfig fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
          go build -trimpath -ldflags="-s -w" -o bin/pilot ./cmd/pilot
      - name: fine schedtrace
        run: |
          for v in prime noprime prime noprime prime noprime; do
            echo "=== variant $v"
            GODEBUG=schedtrace=10 GNUI_NO_PRIME_THREADS=$([ "$v" = prime ] || echo 1) xvfb-run -a -s "-screen 0 1280x800x24" ./bin/pilot -bench -gate -allow-unpaced -max-cpu-us 0 -timeout 200s > all.txt 2>&1 || true
            grep -v '^SCHED' all.txt > out.json
            python3 -c "import json;d=json.load(open('out.json'));print([w['Mallocs'] for w in d['Windows']], 'last SCHED:', open('all.txt').read().count('SCHED'))"
            grep '^SCHED' all.txt | sed -E 's/^SCHED ([0-9]+)ms: gomaxprocs=[0-9]+ idleprocs=([0-9]+) threads=([0-9]+) spinningthreads=([0-9]+) needspinning=[0-9]+ idlethreads=([0-9]+).*/\1ms idleP=\2 threads=\3 spin=\4 idleM=\5/' | awk '{ split($3,a,"="); split($5,b,"="); if (a[2] != lt || b[2] <= 1) { print; lt=a[2] } }' | head -40
          done
